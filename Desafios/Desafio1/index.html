<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Desafio 1 - Cartão de Perfil</title>
    <style>
        body {
            background-color: #f0f0f0;
            text-align: center;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 60px;
        }

        .cartao {
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
            padding: 30px;
            width: 300px;
        }

        .cartao img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4a90e2;
        }

        h1 {
            color: #2c3e50;
            margin: 15px 0 5px 0;
        }

        p.frase {
            color: #666;
            font-style: italic;
            margin-bottom: 20px;
        }

        .links a {
            display: inline-block;
            margin: 0 8px;
            text-decoration: none;
            color: #ffffff;
            background-color: #e036d5;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
        }

        .links a:hover {
            background-color: #fbaef3;
        }

    </style>
</head>
<body>
    <div class="cartao">
    <img src="image.png" alt="Foto de perfil de Sandrini Moraes Correa">
    <h1>Sandrini</h1>
    <p class="cargo">Estudante de Bacharelado em Sistemas de Informação - 4º Semestre</p>
    <p class="frase">"Aprendendo programação, um desafio de cada vez."</p>
    <div class="links">
      <a href="https://github.com/sandrinimoraes-c" target="_blank">GitHub</a>
      <a href="https://instagram.com/sand.smc" target="_blank">Instagram</a>
    </div>
  </div>
</body>
</html>
